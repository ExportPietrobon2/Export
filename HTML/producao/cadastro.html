<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro · Pietrobon</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ED3237">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/CSS/style.css">
  <style>
    .btn-nova-pi-toggle {
      border: 1.5px dashed var(--red); background: var(--red-light);
      color: var(--red-dark); border-radius: var(--r); padding: 10px 20px;
      font-weight: 700; font-size: .9rem; cursor: pointer; transition: all .15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-nova-pi-toggle:hover { background: var(--red); color: #fff; }

    .form-nova-pi-wrap {
      background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg);
      padding: 20px; margin-top: 10px; box-shadow: var(--shadow); display: none;
    }

    .btn-add-produto-inline {
      width: 100%; border: 1.5px dashed #c0cad8; background: transparent;
      color: var(--muted); border-radius: 8px; padding: 7px; font-size: .82rem;
      font-weight: 600; cursor: pointer; transition: all .15s; margin-top: 8px;
    }
    .btn-add-produto-inline:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }

    .form-add-produto {
      background: #fafbfd; border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; margin-top: 8px;
    }

    /* Autocomplete */
    .ac-lista {
      position: absolute; top: calc(100% + 3px); left: 0; right: 0;
      background: #fff; border: 1px solid #e4e7ef; border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.12); z-index: 300;
      max-height: 200px; overflow-y: auto;
    }
    .ac-item {
      padding: 8px 14px; cursor: pointer; font-size: .83rem; color: #334155;
      border-bottom: 1px solid #f5f5f5; transition: background .1s;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: var(--red-light); color: var(--red-dark); }

    /* Catálogo */
    .catalogo-wrap {
      background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg);
      padding: 16px; margin-top: 10px; box-shadow: var(--shadow); display: none;
      max-height: 320px; overflow-y: auto;
    }
    .catalogo-item { font-size: .83rem; color: #334155; }
  </style>
</head>
<body data-pagina="cadastro.html">
  <div id="cabecalho"></div>
  <div class="container py-4">
    <div class="page-header">
      <div class="page-header-icon"></div>
      <div class="page-header-texto">
        <h1 class="page-titulo">Cadastro de PIs e Produtos</h1>
        <p class="page-subtitulo">Registre as PIs e os produtos acompanhados pelo almoxarifado e pelo depósito</p>
      </div>
    </div>

    <div id="area-admin" class="mb-4">
      <div class="d-flex align-items-center gap-3 flex-wrap mb-2">
        <button class="btn-nova-pi-toggle" id="btn-toggle-nova-pi">➕ Nova PI</button>
        <div>
          <button class="btn btn-sm btn-outline-secondary" id="btn-toggle-catalogo" style="border-radius:8px">
            Ver catálogo ▾
          </button>
          <span class="small text-muted ms-2" id="catalogo-total"></span>
        </div>
      </div>

      <div class="form-nova-pi-wrap" id="form-nova-pi-wrap">
        <h5 class="secao-titulo-card mb-3">Cadastrar nova PI</h5>
        <form id="form-novo-pi" class="row g-2 align-items-end">
          <div class="col-12 col-sm-6 col-lg-3">
            <input type="text" id="numero-pi" class="form-control" placeholder="Número da PI (ex: 159 VEN)" required>
          </div>
          <div class="col-12 col-sm-6 col-lg-2">
            <label class="form-label small fw-semibold mb-0">Data</label>
            <input type="date" id="data-cadastro" class="form-control">
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <input type="text" id="cliente-pi" class="form-control" placeholder="Cliente">
          </div>
          <div class="col-12 col-sm-6 col-lg-2">
            <input type="text" id="destino-pi" class="form-control" placeholder="Destino / País">
          </div>
          <div class="col-12 col-lg-2 d-flex gap-2">
            <button type="submit" class="btn btn-pietrobon flex-fill">✔ Cadastrar</button>
            <button type="button" class="btn btn-outline-secondary" id="btn-cancelar-nova-pi">✕</button>
          </div>
        </form>
      </div>

      <div class="catalogo-wrap" id="catalogo-wrap">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="secao-titulo-card mb-0" style="border:none;padding:0;font-size:.85rem">📦 Catálogo de produtos salvos</span>
          <span class="small text-muted fst-italic">Clique ✕ para remover do catálogo</span>
        </div>
        <div id="lista-catalogo"></div>
      </div>
    </div>

    <h5 class="secao-titulo-card mb-3">PIs cadastradas</h5>
    <div id="lista-pedidos"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/JS/producao/cadastro.js"></script>
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js') }</script>
</body>
</html>
