<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices · Pietrobon</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ED3237">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/CSS/style.css">
</head>
<body data-pagina="invoices.html">
  <div id="cabecalho"></div>
  <div class="container py-4">
    <div class="page-header">
      <div class="page-header-icon"></div>
      <div class="page-header-texto">
        <h1 class="page-titulo">Invoices de Exportação</h1>
        <p class="page-subtitulo">Cadastro, geração de Invoice Comercial e Packing List</p>
      </div>
    </div>
    <div id="conteudo-invoices"><p class="text-muted">Carregando...</p></div>
  </div>

  <div class="modal fade" id="modal-invoice" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-invoice-titulo">Nova Invoice</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modal-invoice-corpo"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal-preview" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-preview-titulo">Visualizar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0" id="modal-preview-corpo"></div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" onclick="window.print()">🖨️ Imprimir / PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/JS/financeiro/invoices.js"></script>
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js') }</script>
</body>
</html>
