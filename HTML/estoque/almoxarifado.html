<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almoxarifado · Pietrobon</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ED3237">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/CSS/style.css">
</head>
<body data-pagina="almoxarifado.html">
  <div id="cabecalho"></div>
  <div class="container py-4">
    <div class="page-header">
      <div class="page-header-icon"></div>
      <div class="page-header-texto">
        <h1 class="page-titulo">Almoxarifado</h1>
        <p class="page-subtitulo">Declaração de estoque de insumos por produto e por PI</p>
      </div>
    </div>
    <div id="alerta-declaracao-almox"></div>
    <div class="card border-0 shadow-sm mb-4">
      <style>
        .pi-grupo-chips { margin-bottom: 4px; }
        .pi-grupo-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #64748b; margin-bottom: 0; }
        .pi-chips-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0 6px 18px; }
        .pi-chip { border: 1.5px solid #e4e7ef; border-radius: 999px; padding: 5px 14px; cursor: pointer; background: #fff; font-size: .82rem; font-weight: 600; color: #334155; transition: all .15s; display: inline-flex; align-items: center; gap: 7px; line-height: 1.3; }
        .pi-chip:hover { border-color: var(--red); color: var(--red); background: #fef2f2; }
        .pi-chip-ativo { border-color: var(--red) !important; background: var(--red) !important; color: #fff !important; box-shadow: 0 2px 8px rgba(232,49,58,.25); }
        .pi-chip-cliente { font-size: .72rem; font-weight: 500; opacity: .75; }
        #pi-selecionada-badge { display: inline-block; font-size: .78rem; font-weight: 600; color: var(--red); background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 3px 10px; }
        .sel-pais-header, .sel-ano-header { width: 100%; border: none; background: transparent; display: flex; align-items: center; gap: 8px; padding: 7px 6px; cursor: pointer; text-align: left; border-radius: 8px; transition: background .12s; }
        .sel-pais-header:hover { background: #f8fafd; }
        .sel-ano-header { padding: 5px 6px 5px 18px; }
        .sel-ano-header:hover { background: #f8fafd; }
        .sel-chevron { font-size: .62rem; color: #94a3b8; width: 12px; }
        .sel-ano-label { font-size: .8rem; font-weight: 700; color: #475569; }
        .sel-ano-qtd { font-size: .7rem; color: #94a3b8; margin-left: auto; }
        .sel-pais-corpo { padding-left: 4px; }
        .sel-ano-grupo { margin-bottom: 2px; }
      </style>
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <label class="form-label fw-semibold small mb-0">Selecionar PI</label>
          <span id="pi-selecionada-badge" style="display:none"></span>
        </div>
        <input type="text" id="busca-pi" class="form-control form-control-sm mb-3"
          placeholder="🔍  Buscar por número, cliente ou destino...">
        <div id="lista-pi-chips"></div>
      </div>
    </div>
    <div class="d-flex gap-2 mb-3 flex-wrap">
      <button class="btn btn-sm btn-outline-danger active" data-aba="estoque">Estoque PI</button>
      <button class="btn btn-sm btn-outline-danger" data-aba="estoque-geral">Estoque Geral</button>
      <button class="btn btn-sm btn-outline-danger" data-aba="recebimentos">Recebimentos B2</button>
      <button class="btn btn-sm btn-outline-danger" data-aba="rendimentos">Rendimentos</button>
      <button class="btn btn-sm btn-outline-danger" data-aba="pedidos">Pedidos ao Compras</button>
    </div>
    <div id="aba-estoque"><div id="conteudo-pi"></div></div>
    <div id="aba-estoque-geral" style="display:none"><div id="conteudo-estoque-geral"></div></div>
    <div id="aba-recebimentos" style="display:none"><div id="conteudo-recebimentos"></div></div>
    <div id="aba-rendimentos" style="display:none"><div id="conteudo-referencia-wrapper-almox"></div></div>
    <div id="aba-pedidos" style="display:none"><div id="wrap-pedidos-compra-almox"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/JS/estoque/almoxarifado.js"></script>
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js') }</script>
</body>
</html>
